<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTO Portal</title>
<link rel="icon" href="gto-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0E1013;--ink:#F1EDE4;--muted:#A9A69E;--faint:#77756F;
  --glass:rgba(255,255,255,.055);--glass-2:rgba(255,255,255,.085);--glass-hi:rgba(255,255,255,.12);
  --edge:rgba(255,255,255,.10);--edge-2:rgba(255,255,255,.16);
  --gold:#E3B95A;--gold-2:#B8892F;--gold-ink:#241A06;--gold-grad:linear-gradient(135deg,#F8E19A 0%,#E2B652 45%,#B98A2F 100%);
  --ok:#62D394;--ok-soft:rgba(98,211,148,.14);--bad:#FF8A80;--bad-soft:rgba(255,138,128,.14);--warn:#F4C55B;--warn-soft:rgba(244,197,91,.14);--info:#86C8EC;--info-soft:rgba(134,200,236,.13);
  --r:16px;--focus:0 0 0 3px rgba(227,185,90,.45);--blur:saturate(140%) blur(18px);
  /* aliases used by older inline styles */
  --line:var(--edge);--paper:var(--glass);--soft:var(--glass-2);--petrol:#15181D;--petrol-2:rgba(255,255,255,.08);--petrol-3:rgba(255,255,255,.14);--on-petrol:var(--ink);--on-petrol-2:var(--muted);--amber:var(--gold);--amber-ink:var(--gold-ink);
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
  background:
    radial-gradient(900px 520px at 88% -8%, rgba(227,185,90,.20), transparent 62%),
    radial-gradient(700px 600px at 8% 105%, rgba(70,110,140,.22), transparent 60%),
    radial-gradient(600px 400px at 45% 40%, rgba(227,185,90,.05), transparent 70%),
    var(--bg);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
select option{background:#1B1E23;color:var(--ink)}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:8px}
.num,.b-v,.stat,.clockface{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.glass,.card,.metrics,.side,.board,.tablewrap,.counts,.week,.req,.modal .card,.toast,.mtop,.demo{backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}

/* shell */
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;align-self:start;display:flex;flex-direction:column;padding:22px 16px;background:rgba(12,13,16,.55);border-right:1px solid var(--edge)}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 28px}
.brand img{width:52px;height:52px;border-radius:50%;box-shadow:0 0 0 1px rgba(227,185,90,.35),0 6px 22px rgba(227,185,90,.18)}
.brand .bt{line-height:1.2}.brand .bt b{display:block;font:600 15px/1.15 Cinzel,serif;letter-spacing:.6px;color:var(--gold)}.brand .bt span{font-size:12.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:1px solid transparent;color:var(--muted);padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:500;text-align:left;position:relative}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--glass);color:var(--ink)}
.nav button.on{background:linear-gradient(135deg,rgba(227,185,90,.18),rgba(227,185,90,.06));border-color:rgba(227,185,90,.32);color:#fff}
.nav button.on svg{stroke:var(--gold)}
.nav .badge{margin-left:auto;background:var(--gold-grad);color:var(--gold-ink);border-radius:999px;font-size:12px;font-weight:700;min-width:22px;text-align:center;padding:0 6px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--edge);border-radius:14px;background:var(--glass)}
.av{width:36px;height:36px;border-radius:50%;background:var(--gold-grad);color:var(--gold-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me .who{min-width:0;flex:1}.me .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.me .who span{font-size:12.5px;color:var(--muted)}
.me button{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px}.me button:hover{color:var(--gold)}
.mtop{display:none}
.mainwrap{min-width:0}
.demo{background:rgba(244,197,91,.10);color:var(--warn);padding:9px 36px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid rgba(244,197,91,.22)}
.demo select.i{width:auto;max-width:100%;padding:4px 8px}
.ph{display:flex;align-items:flex-end;gap:16px;padding:34px 36px 8px;max-width:1300px}
.ph h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.4px}
.ph p{margin:6px 0 0;color:var(--muted)}
.ph .today{margin-left:auto;color:var(--muted);font-size:14px;white-space:nowrap;padding:7px 14px;border:1px solid var(--edge);border-radius:999px;background:var(--glass)}
main{max-width:1300px;padding:20px 36px 80px}

/* surfaces */
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);padding:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.card h2{margin:0 0 14px;font-size:17px;font-weight:600}
.card h3{margin:0 0 6px;font-size:13.5px;color:var(--muted);font-weight:500}
.sec{margin-top:20px}
.muted{color:var(--muted)}
.stat{font-size:34px;font-weight:600;line-height:1.1}
.stat small{font:500 14px "IBM Plex Sans",system-ui,sans-serif;color:var(--muted)}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.metrics .m{padding:20px 24px;border-left:1px solid var(--edge);margin-left:-1px}
.metrics .m h3{margin:0 0 6px;font-size:13.5px;color:var(--muted);font-weight:500}
.metrics .m p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.metrics .m.go{cursor:pointer}.metrics .m.go:hover{background:var(--glass-2)}
.metrics .m.alert-m .stat{color:var(--bad)}

/* agent status bar */
.statusbar{position:sticky;top:0;z-index:35;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 36px;background:rgba(16,18,22,.72);border-bottom:1px solid var(--edge);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.sb-state{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.sb-state .dot{width:11px;height:11px;border-radius:50%;background:var(--faint);flex:none}
.sb-state b{display:block;font-weight:600;font-size:15px}.sb-state span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusbar.m-work .dot{background:var(--ok);box-shadow:0 0 0 5px rgba(98,211,148,.18)}
.statusbar.m-break .dot{background:var(--gold);box-shadow:0 0 0 5px rgba(227,185,90,.2)}
.statusbar.m-over .dot{background:var(--bad);box-shadow:0 0 0 5px rgba(255,138,128,.2)}.statusbar.m-over .sb-state b{color:var(--bad)}
.seg{display:inline-flex;padding:4px;gap:4px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--edge-2)}
.seg button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap}
.seg button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg button:hover:not(:disabled):not(.on){color:var(--ink);background:var(--glass-hi)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.seg button.on{opacity:1;cursor:default;color:var(--gold-ink);background:var(--gold-grad);box-shadow:0 4px 16px rgba(227,185,90,.3)}
.m-work .seg button[data-st="work"].on{background:linear-gradient(135deg,#9FF0C2,#4FC283);color:#08240F;box-shadow:0 4px 16px rgba(98,211,148,.3)}
.m-out .seg button[data-st="out"].on{background:var(--glass-hi);color:var(--ink);box-shadow:none}
.seg button.armed{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,138,128,.5)}
.board.noact{grid-template-columns:1.3fr 1fr 1.15fr 1fr}
.board.noact .b-cell:nth-child(4){border-right:0}

/* hero board */
.board{position:relative;border-radius:22px;display:grid;grid-template-columns:1.3fr 1fr 1.15fr 1fr auto;align-items:stretch;overflow:hidden;
  background:linear-gradient(140deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 55%),rgba(20,22,27,.55);
  border:1px solid rgba(227,185,90,.30);box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.10)}
.board::before{content:"";position:absolute;inset:-40% auto auto -10%;width:55%;height:180%;background:radial-gradient(closest-side,rgba(227,185,90,.18),transparent);pointer-events:none}
.b-cell{position:relative;padding:24px 26px;border-right:1px solid var(--edge);display:flex;flex-direction:column;gap:4px;min-width:0}
.b-l{font-size:13px;color:var(--muted)}
.b-v{font-size:30px;font-weight:600;line-height:1.12;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-v small{font-size:16px;color:var(--muted);font-weight:500}
.b-time .b-v{font-size:62px;letter-spacing:1px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
.b-s{font-size:13px;color:var(--muted)}
.board .b-cell:nth-child(3) .b-v{white-space:normal;font-size:26px}
.b-v .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px;vertical-align:middle;background:var(--faint)}
.board.s-in .b-v .dot{background:var(--ok);box-shadow:0 0 0 5px rgba(98,211,148,.18)}
.board.s-break .b-v .dot{background:var(--gold);box-shadow:0 0 0 5px rgba(227,185,90,.2)}
.board.s-over .b-v .dot{background:var(--bad);box-shadow:0 0 0 5px rgba(255,138,128,.2)}
.board.s-over{border-color:rgba(255,138,128,.45)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.10);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-grad);border-radius:3px}
.bar i.over{background:var(--bad)}
.b-act{position:relative;padding:20px 24px;display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:210px}
.bbtn{border:0;border-radius:12px;padding:15px 20px;font-weight:600;font-size:15.5px;cursor:pointer;white-space:nowrap}
.bbtn.go{background:var(--gold-grad);color:var(--gold-ink);box-shadow:0 8px 24px rgba(227,185,90,.28)}
.bbtn.go:hover{filter:brightness(1.07)}
.bbtn.ghost{background:var(--glass);color:#fff;border:1px solid var(--edge-2)}
.bbtn.ghost:hover{background:var(--glass-hi)}
.bbtn:disabled{opacity:.5;cursor:wait}

/* controls */
.btn{border:1px solid var(--edge-2);background:var(--glass);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--glass-hi)}
.btn.primary{background:var(--gold-grad);border-color:transparent;color:var(--gold-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{border-color:rgba(255,138,128,.45);color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.warn{background:var(--gold);color:var(--gold-ink)}
.btn.big{padding:14px 20px;font-size:16px;border-radius:12px}
.btn.sm{padding:4px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:500;margin:14px 0 6px}
input.i,select.i,textarea.i{width:100%;padding:10px 12px;border:1px solid var(--edge-2);border-radius:10px;background:rgba(0,0,0,.22)}
input.i::placeholder,textarea.i::placeholder{color:var(--faint)}
input.i:focus,select.i:focus,textarea.i:focus{border-color:rgba(227,185,90,.6);box-shadow:var(--focus);outline:none}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .i{width:auto}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--edge);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:rgba(22,24,29,.92);position:sticky;top:0;z-index:1;white-space:nowrap}
tbody tr:hover td{background:rgba(255,255,255,.03)}
.tablewrap{overflow:auto;max-height:68vh;border:1px solid var(--edge);border-radius:12px;background:rgba(0,0,0,.14)}
.tablewrap table tr:last-child td{border-bottom:0}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--glass-2);border:1px solid var(--edge);border-radius:8px;padding:1px 9px;font-size:12.5px;margin:2px 4px 2px 0;white-space:nowrap}
.chip.ok,.chip.bad,.chip.warn,.chip.info{border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.ok::before,.chip.bad::before,.chip.warn::before,.chip.info::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.req .kv{display:flex;flex-wrap:wrap;gap:6px 22px;margin:10px 0 2px}.req .kv span{display:flex;flex-direction:column;font-weight:600;font-size:14px}.req .kv small{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#999)}
.alert{border-radius:12px;padding:13px 16px;margin-bottom:18px;border:1px solid currentColor;border-left-width:4px}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--info-soft);color:var(--info)}

.counts{display:flex;flex-wrap:wrap;border:1px solid var(--edge);border-radius:12px;overflow:hidden;margin:14px 0;background:var(--glass)}
.counts div{padding:10px 18px;border-right:1px solid var(--edge);font-size:13px;color:var(--muted)}
.counts b{display:block;font:600 22px "IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;color:var(--ink)}
.counts .bad b{color:var(--bad)}.counts .warn b{color:var(--warn)}.counts .ok b{color:var(--ok)}

.req{border:1px solid var(--edge);border-left:3px solid var(--gold);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--glass)}
.req.flag{border-left-color:var(--bad)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.cal .dow{font-size:12.5px;color:var(--muted);font-weight:600;padding:0 4px}
.cal .day{border:1px solid var(--edge);border-radius:10px;min-height:86px;padding:8px;font-size:12px;cursor:pointer;background:rgba(255,255,255,.03);overflow:hidden}
.cal .day:hover{background:var(--glass-2)}
.cal .day.out{opacity:.35}
.cal .day.today{border-color:rgba(227,185,90,.7);box-shadow:inset 0 0 0 1px rgba(227,185,90,.5)}
.cal .day .n{font:600 15px "IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif}
.cal .day .tot{float:right;font:600 13px "IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;background:rgba(227,185,90,.18);color:var(--gold);border-radius:6px;padding:0 7px}
.cal .day.hi .tot{background:var(--bad-soft);color:var(--bad)}
.datechips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge-2);border-radius:9px;padding:4px 10px;margin:3px;font-size:13px;cursor:pointer;background:var(--glass)}
.datechips label:has(input:checked){border-color:rgba(227,185,90,.55);background:rgba(227,185,90,.12)}
input[type=checkbox]{accent-color:var(--gold)}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;background:var(--glass)}
.week>div{padding:13px 15px;border-left:1px solid var(--edge);margin-left:-1px;min-width:0}
.week span{display:block;font-size:12.5px;color:var(--muted)}
.week b{display:block;font:600 16px "IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week>div.off b{color:var(--faint);font-weight:500}
.week>div.today{background:linear-gradient(160deg,rgba(227,185,90,.22),rgba(227,185,90,.06))}.week>div.today b{color:var(--gold)}
.swaptag{display:block;font-style:normal;font-size:11.5px;color:var(--info);margin-top:2px}

.sched td.off{color:var(--faint)}
.sched td.today{background:rgba(227,185,90,.08)}
.modal{position:fixed;inset:0;background:rgba(5,6,8,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(4px)}
.modal .card{max-width:680px;width:100%;max-height:90vh;overflow:auto;background:rgba(28,31,37,.85);border-color:var(--edge-2)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(28,31,37,.85);color:#fff;padding:11px 20px;border-radius:12px;z-index:60;font-weight:500;border:1px solid rgba(227,185,90,.4)}
.center{text-align:center}
.loading{padding:70px;text-align:center;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- Knowledge base ---------- */
.kb-hero{position:relative;padding:22px 24px 18px;background:linear-gradient(135deg,rgba(227,185,90,.14),rgba(255,255,255,.035) 55%);border:1px solid var(--edge-2);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.kb-search{position:relative}.kb-search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2}
.kb-search input{width:100%;padding:15px 16px 15px 48px;font-size:16.5px;border-radius:14px;border:1px solid var(--edge-2);background:rgba(0,0,0,.32);color:var(--ink)}
.kb-search input:focus{outline:none;border-color:rgba(227,185,90,.6);box-shadow:0 0 0 4px rgba(227,185,90,.12)}
.kb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.kb-row .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.pill{border:1px solid var(--edge-2);background:var(--glass);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill:hover{color:var(--ink);background:var(--glass-hi)}.pill.on{background:var(--gold-grad);color:var(--gold-ink);border-color:transparent;font-weight:600}
.pill .n{font-size:11.5px;opacity:.75}.pill svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.kb-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 2px 12px;color:var(--muted);font-size:13.5px}
.kb-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start;margin-top:22px}
.kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.kb-card{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;padding:18px 18px 16px;border-radius:16px;border:1px solid var(--edge);background:var(--glass);cursor:pointer;color:var(--ink);transition:transform .15s,border-color .15s,background .15s;min-width:0}
.kb-card:hover{transform:translateY(-2px);border-color:rgba(227,185,90,.45);background:var(--glass-2)}
.kb-card .top{display:flex;gap:6px;flex-wrap:wrap}
.kb-card h3{margin:0;font-size:16px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kb-card p{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.kb-card .foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:6px;border-top:1px solid var(--edge)}
.cov{display:flex;gap:5px}.cov i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.03);border:1px solid var(--edge)}
.cov i svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cov i.y{background:rgba(227,185,90,.14);border-color:rgba(227,185,90,.35)}.cov i.y svg{stroke:var(--gold)}
.cov i.n{opacity:.45}
.chip.cat{background:rgba(227,185,90,.12);color:var(--gold);border-color:rgba(227,185,90,.3)}
.chip.mute{color:var(--faint)}
.kb-side .card{padding:20px}
.kb-up{padding:14px 0;border-top:1px solid var(--edge)}.kb-up:first-of-type{border-top:0;padding-top:4px}
.kb-up h4{margin:0 0 4px;font-size:14.5px;font-weight:600;display:flex;gap:6px;align-items:flex-start}
.kb-up .body{font-size:13.5px;line-height:1.55;color:var(--muted);white-space:pre-line;overflow:hidden;max-height:4.7em}
.kb-up.open .body{max-height:none}
.kb-up .by{font-size:12px;color:var(--faint);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kb-up .by button{background:none;border:0;color:var(--faint);cursor:pointer;padding:0;font-size:12px}.kb-up .by button:hover{color:var(--gold)}
.newtag{font-size:10.5px;font-weight:700;letter-spacing:.06em;background:var(--gold-grad);color:var(--gold-ink);border-radius:6px;padding:1px 6px;flex:none;margin-top:2px}
.modal .card.wide{max-width:960px}
.kb-d-head{display:flex;gap:14px;align-items:flex-start}.kb-d-head h2{margin:6px 0 0;font-size:22px;line-height:1.25}
.kb-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--edge);border:1px solid var(--edge);border-radius:14px;overflow:hidden;margin:18px 0}
.kb-facts div{background:rgba(22,24,29,.96);padding:12px 14px;min-width:0}
.kb-facts small,.kb-sec small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.kb-facts div span{font-size:14px;line-height:1.45;white-space:pre-line;word-break:break-word}
.kb-covlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:0 0 18px}
.kb-covlist div{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--edge);border-radius:11px;font-size:14px}
.kb-covlist div.y{border-color:rgba(227,185,90,.35);background:rgba(227,185,90,.08)}.kb-covlist div.n{color:var(--faint)}
.kb-covlist b{margin-left:auto;font-size:12.5px}.kb-covlist .y b{color:var(--gold)}
.kb-sec{padding:14px 0;border-top:1px solid var(--edge)}.kb-sec div{font-size:14.5px;line-height:1.6;white-space:pre-line;word-break:break-word}
.kb-sec a,.ai-msg a{color:var(--gold)}
/* assistant */
.ai-fab{position:fixed;right:28px;bottom:28px;z-index:45;display:flex;align-items:center;gap:10px;padding:13px 20px 13px 16px;border-radius:999px;border:0;cursor:pointer;background:var(--gold-grad);color:var(--gold-ink);font-weight:700;font-size:15px;box-shadow:0 12px 34px rgba(227,185,90,.35),0 0 0 1px rgba(255,255,255,.2) inset}
.ai-fab svg,.ai-head svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ai-fab:hover{filter:brightness(1.06)}
.ai-panel{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);z-index:60;display:flex;flex-direction:column;background:rgba(17,19,23,.92);border-left:1px solid var(--edge-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:-30px 0 80px rgba(0,0,0,.45);transform:translateX(105%);transition:transform .25s ease}
.ai-panel.open{transform:none}
.ai-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--edge)}
.ai-head .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--gold-grad);color:var(--gold-ink)}
.ai-head b{display:block;font-size:16px}.ai-head span{font-size:12.5px;color:var(--muted)}
.ai-head button{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:24px;line-height:1;padding:4px 8px;border-radius:8px}.ai-head button:hover{color:var(--ink);background:var(--glass)}
.ai-body{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.ai-msg{max-width:92%;font-size:14.5px;line-height:1.6;word-break:break-word}
.ai-msg.u{align-self:flex-end;background:var(--gold-grad);color:var(--gold-ink);padding:10px 14px;border-radius:16px 16px 4px 16px;font-weight:500;white-space:pre-line}
.ai-msg.a{align-self:flex-start;background:var(--glass);border:1px solid var(--edge);padding:12px 16px;border-radius:16px 16px 16px 4px}
.ai-msg.a p{margin:0 0 8px}.ai-msg.a p:last-child,.ai-msg.a ul:last-child{margin-bottom:0}.ai-msg.a ul{margin:0 0 8px;padding-left:18px}.ai-msg.a li{margin:2px 0}
.ai-msg.a h4{margin:6px 0 4px;font-size:14.5px;color:var(--gold)}
.ai-msg.err{border-color:rgba(255,138,128,.4);color:var(--bad)}
.ai-follow{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 2px;max-width:92%}.ai-follow button{border:1px solid rgba(227,185,90,.4);background:rgba(227,185,90,.08);color:var(--gold);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}.ai-follow button:hover{background:rgba(227,185,90,.18)}
.ai-msg{unicode-bidi:plaintext}.ai-msg p,.ai-msg li{unicode-bidi:plaintext;text-align:start}
.ai-ref{display:inline;border:0;background:rgba(227,185,90,.14);color:var(--gold);border-radius:6px;padding:0 6px;cursor:pointer;font:inherit;font-weight:600}
.ai-ref:hover{background:rgba(227,185,90,.26)}
.ai-dots{display:inline-flex;gap:4px}.ai-dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:aid 1s infinite ease-in-out}.ai-dots i:nth-child(2){animation-delay:.15s}.ai-dots i:nth-child(3){animation-delay:.3s}
@keyframes aid{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.ai-sugg{display:flex;flex-direction:column;gap:8px}.ai-sugg button{text-align:left;border:1px solid var(--edge-2);background:var(--glass);color:var(--ink);border-radius:12px;padding:10px 13px;cursor:pointer;font-size:14px}.ai-sugg button:hover{border-color:rgba(227,185,90,.5);background:var(--glass-2)}
.ai-foot{padding:14px 16px 18px;border-top:1px solid var(--edge)}
.ai-in{display:flex;gap:8px;align-items:flex-end}.ai-in textarea{flex:1;resize:none;max-height:140px;min-height:46px;padding:12px 14px;border-radius:14px;border:1px solid var(--edge-2);background:rgba(0,0,0,.3);color:var(--ink);font:inherit;font-size:14.5px}
.ai-in textarea:focus{outline:none;border-color:rgba(227,185,90,.6)}
.ai-in button{height:46px;width:46px;border-radius:14px;border:0;background:var(--gold-grad);color:var(--gold-ink);cursor:pointer;display:grid;place-items:center;flex:none}.ai-in button:disabled{opacity:.4;cursor:not-allowed}
.ai-in button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.ai-note{font-size:11.5px;color:var(--faint);margin-top:8px;display:flex;gap:10px}.ai-note button{background:none;border:0;color:var(--faint);cursor:pointer;padding:0;font-size:11.5px;margin-left:auto;white-space:nowrap;align-self:flex-start}.ai-note button:hover{color:var(--gold)}
@media (max-width:1100px){.kb-layout{grid-template-columns:1fr}.kb-side{order:-1}}
@media (max-width:820px){.ai-fab{right:16px;bottom:96px;padding:12px 16px}.ai-fab span{display:none}.kb-hero{padding:16px}.kb-row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.ai-panel{width:100vw}}
@media (max-width:1150px){.board,.board.noact{grid-template-columns:1fr 1fr}.b-time{grid-column:1/-1}.board .b-cell:nth-child(4){grid-column:1/-1;border-right:0}.b-act{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;border-top:1px solid var(--edge)}.b-act .bbtn{flex:1}.b-cell{border-bottom:1px solid var(--edge)}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;bottom:10px;top:auto;left:10px;right:10px;height:auto;padding:6px;z-index:40;flex-direction:row;border:1px solid var(--edge-2);border-radius:18px;background:rgba(18,20,24,.78)}
  .side .brand,.side .me{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around;gap:2px}
  .nav button{flex-direction:column;gap:3px;font-size:11.5px;padding:7px 4px;flex:1;align-items:center;border-radius:12px}
  .nav .badge{position:absolute;top:2px;right:calc(50% - 24px);margin:0;font-size:10.5px;min-width:18px}
  .mtop{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(12,13,16,.6);border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:30}
  .mtop img{width:36px;height:36px;border-radius:50%}
  .mtop b{font:600 14px Cinzel,serif;color:var(--gold);letter-spacing:.5px}
  .mtop .av{margin-left:auto;width:32px;height:32px}
  .ph{padding:22px 16px 4px}.ph h1{font-size:24px}.ph .today{display:none}
  main{padding:14px 16px 110px}
  .demo{padding:8px 16px}
  .b-time .b-v{font-size:48px}.b-v{font-size:24px;white-space:normal}.b-cell{padding:16px 18px}
  .week{grid-template-columns:1fr}.week>div{display:flex;justify-content:space-between;align-items:center;border-left:0;margin-left:0;border-top:1px solid var(--edge);margin-top:-1px;flex-wrap:wrap}.week span{font-size:14px}.swaptag{width:100%;text-align:right}
  .cal .day{min-height:58px;padding:5px}.cal .day div{display:none}
  .toast{bottom:96px}
  .statusbar{top:61px;padding:10px 16px;gap:10px}
  .sb-state{flex-basis:100%}
  .seg{width:100%}.seg button{flex:1;justify-content:center;padding:10px 6px}
  .board.noact{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.metrics,.week,.req{background:#1A1D22}.side{background:#121418}}
</style>

/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w = (x.getDay()+6)%7; return addDays(x,-w); };
const hm = d => d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
const fmtDate = k => { if(!k) return ''; const d = typeof k==='string'?fromKey(k):k; return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}); };
const fmtMins = m => { if(m==null||isNaN(m)) return ''; m=Math.round(m); const s=m<0?'-':''; m=Math.abs(m); return s+(m>=60?`${Math.floor(m/60)}h ${pad(m%60)}m`:`${m}m`); };
const serialToDate = n => { const ms = Math.round((n - 25569) * 864e5); const u = new Date(ms); return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate()); };
const dateToSerial = d => (Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(1899,11,30)) / 864e5;
function parseDateCell(v){
  if (v==null || v==='') return null;
  if (typeof v === 'number') return v > 20000 && v < 80000 ? serialToDate(v) : null;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return new Date(+m[1],+m[2]-1,+m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (m) return new Date(m[3].length===2?2000+ +m[3]:+m[3], +m[2]-1, +m[1]);
  if (/^\d+(\.\d+)?$/.test(s)) return parseDateCell(Number(s));
  const t = Date.parse(s); return isNaN(t) ? null : new Date(new Date(t).setHours(0,0,0,0));
}
const norm = s => String(s??'').replace(/\u00a0|\u202f/g,' ').toLowerCase().replace(/\(.*?\)/g,m=>' '+m.slice(1,-1)+' ').replace(/[^a-z\u0600-\u06ff ]+/g,' ').replace(/\s+/g,' ').trim();
const normEmail = s => String(s??'').trim().toLowerCase();
const uid = p => p + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
const yes = v => /^y(es)?$/i.test(String(v??'').trim()) || v===true;
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function rowsToObjects(values){ const h = values[0].map(x=>String(x??'').trim()); return { headers:h, rows: values.slice(1).map((r,i)=>{ const o={_i:i}; h.forEach((k,j)=>o[k]=r[j]); return o; }) }; }

const LEAVE_TYPES_ALL = ['Holiday','Emergency','UPL','Sick'];
const LEAVE_LABEL = {Holiday:'PTO (Holiday)',Emergency:'Emergency',UPL:'UPL',Sick:'Sick'};
const isMgr = u => u && ['Team Leader','Duty Manager','General Manager','HR'].includes(u.role);
const canRaiseForOthers = u => ['Team Leader','Duty Manager','General Manager'].includes(u.role);

/* ============================ shift text ============================ */
function parseShift(text){
  const s = String(text||'');
  const m = s.match(/(\d{1,2})\s*[:.]\s*(\d{2})\s*-\s*(\d{1,2})\s*[:.]?\s*(\d{2})/);
  if (!m) return null;
  const start = (+m[1])*60 + (+m[2]); let end = (+m[3])*60 + (+m[4]);
  if (end <= start) end += 1440;
  return { start, end, label: `${pad(m[1])}:${m[2]}–${pad(m[3])}:${m[4]}` };
}

/* ============================ rota parsing ============================ */
const DAYRX = /^(mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?\s+(\d{1,2})\s*\/\s*(\d{1,2})/i;
function parseRotaSheet(grid, weekStart){
  const people = []; const seen = new Set();
  const H = grid.length;
  for (let r=0;r<H;r++){
    const row = grid[r]||[];
    for (let c=1;c<row.length;c++){
      if (!DAYRX.test(String(row[c]||'').trim()) || DAYRX.test(String(row[c-1]||'').trim())) continue;
      // run of day headers starting at c
      let n=0; while (n<7 && DAYRX.test(String(row[c+n]||'').trim())) n++;
      if (n<5) continue;
      const rawLabel = String(row[c-1]||'').trim();
      const label = /^agent name$/i.test(rawLabel)?'Agents':/^tl\s*\/\s*dm$/i.test(rawLabel)?'TL / DM':/^name$/i.test(rawLabel)?'Team':rawLabel.replace(/\s+member$/i,'');
      if (/^shift$/i.test(rawLabel) || /counter/i.test(rawLabel)) continue;
      const dates = [];
      for (let k=0;k<n;k++){ const m = String(row[c+k]).trim().match(DAYRX); dates.push(dateFromDM(+m[2],+m[3],weekStart)); }
      for (let rr=r+1; rr<H; rr++){
        const rw = grid[rr]||[]; const name = String(rw[c-1]||'').replace(/\u00a0/g,' ').trim();
        if (!name) break;
        if (DAYRX.test(String(rw[c]||'').trim())) break;
        if (/counter|^total$|^shift$/i.test(name)) break;
        const days = {};
        dates.forEach((d,k)=>{ days[dkey(d)] = String(rw[c+k]??'').replace(/\u00a0/g,' ').trim(); });
        const key = norm(name)+'|'+label;
        if (seen.has(key)) continue; seen.add(key);
        people.push({ name, team: label || 'Team', days });
      }
    }
  }
  return people;
}
function dateFromDM(d, m, near){
  const base = near || new Date();
  let best=null, bd=1e15;
  for (const y of [base.getFullYear()-1, base.getFullYear(), base.getFullYear()+1]){
    const x = new Date(y,m-1,d); const diff = Math.abs(x-base); if (diff<bd){bd=diff;best=x;}
  }
  return best;
}
function sheetWeekStart(name){
  const m = String(name).match(/(\d{1,2})\s*\.\s*(\d{1,2})/); if (!m) return null;
  const d = dateFromDM(+m[1], +m[2], new Date());
  return d;
}
function tokEq(a,b){ if (a===b) return true; if (a.length<4||b.length<4||Math.abs(a.length-b.length)>1) return false;
  const m=a.length,n=b.length, d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n]<=1; }
function rotaScore(person, rp){
  const full = norm(person['Full Name']).split(' ').filter(Boolean); if (!full.length) return 0;
  const toks = norm(rp.name).split(' ').filter(Boolean);
  if (!toks.length || toks[0] !== full[0]) return 0;
  const rest = full.slice(1); let score = 1;
  for (const t of toks.slice(1)){
    if (rest.includes(t)) score += 2;
    else if (rest.some(f=>tokEq(t,f))) score += 1.5;
    else if (t.length===1 && rest.some(f=>f[0]===t)) score += 1;
    else if (t.length<=2) continue;                      // el, al …
    else return 0;
  }
  if (toks.join(' ')===full.join(' ')) score += 5;
  return score;
}
function buildRotaIndex(accessRows, rotaPeople){
  const idx = new Map(); const claim = new Map();
  for (const person of accessRows){
    const key = person.Email || person['Full Name'];
    const override = norm(person['Rota Name']);
    if (override){ const hit = rotaPeople.find(p=>norm(p.name)===override); if (hit){ idx.set(key, hit); continue; } }
    let best=null, bs=0, tie=false;
    for (const rp of rotaPeople){ const sc = rotaScore(person, rp); if (sc>bs){bs=sc;best=rp;tie=false;} else if (sc && sc===bs && rp!==best) tie=true; }
    if (best && !tie){ idx.set(key, best); const c = claim.get(best)||[]; c.push([key,bs]); claim.set(best,c); }
  }
  for (const [rp, list] of claim){                       // one rota row → one person
    if (list.length<2) continue;
    list.sort((a,b)=>b[1]-a[1]);
    const keep = list[0][1] > list[1][1] ? list[0][0] : null;
    list.forEach(([k])=>{ if (k!==keep && !norm(accessRows.find(p=>(p.Email||p['Full Name'])===k)?.['Rota Name'])) idx.delete(k); });
  }
  return idx;
}
function matchRota(person, rotaPeople, idx){
  idx = idx || buildRotaIndex([person], rotaPeople);
  return idx.get(person.Email || person['Full Name']) || null;
}

/* ============================ Graph data store ============================ */
class GraphStore {
  constructor(getToken){ this.getToken = getToken; this.wb = {}; }
  async req(method, path, body, tries=0){
    const token = await this.getToken();
    const res = await fetch('https://graph.microsoft.com/v1.0'+path, { method, headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' }, body: body?JSON.stringify(body):undefined });
    if ([429,409,503,504].includes(res.status) && tries<4){ await new Promise(r=>setTimeout(r, 800*(tries+1))); return this.req(method,path,body,tries+1); }
    if (!res.ok){ let t=''; try{ t=(await res.json()).error?.message||''; }catch(e){} throw new Error(`${res.status} ${t||res.statusText} (${path.split('?')[0].slice(0,80)})`); }
    return res.status===204 ? null : res.json();
  }
  async book(url){
    if (this.wb[url]) return this.wb[url];
    const direct = url.match(/^https:\/\/([^/]+)(\/personal\/[^/]+)\/Documents\/(.+)$/);
    if (direct){
      const site = await this.req('GET', `/sites/${direct[1]}:${direct[2]}?$select=id`);
      const it = await this.req('GET', `/sites/${site.id}/drive/root:/${direct[3].split('/').map(encodeURIComponent).join('/')}?$select=id,parentReference`);
      return this.wb[url] = `/drives/${it.parentReference.driveId}/items/${it.id}/workbook`;
    }
    const clean = url.split('?')[0];
    const enc = 'u!' + btoa(unescape(encodeURIComponent(clean))).replace(/=+$/,'').replace(/\//g,'_').replace(/\+/g,'-');
    const it = await this.req('GET', `/shares/${enc}/driveItem?$select=id,parentReference`);
    return this.wb[url] = `/drives/${it.parentReference.driveId}/items/${it.id}/workbook`;
  }
  async table(url, name){ const b = await this.book(url); const r = await this.req('GET', `${b}/tables/${encodeURIComponent(name)}/range?$select=values`); return rowsToObjects(r.values); }
  async tableTail(url, name, maxRows){
    const b = await this.book(url);
    const hdr = await this.req('GET', `${b}/tables/${encodeURIComponent(name)}/headerRowRange?$select=values,address`);
    const body = await this.req('GET', `${b}/tables/${encodeURIComponent(name)}/dataBodyRange?$select=address,rowCount`);
    const m = body.address.match(/!([A-Z]+)(\d+):([A-Z]+)(\d+)/);
    const sheet = body.address.split('!')[0].replace(/^'|'$/g,'');
    const first=+m[2], last=+m[4]; const start = Math.max(first, last-maxRows+1);
    const r = await this.req('GET', `${b}/worksheets('${encodeURIComponent(sheet)}')/range(address='${m[1]}${start}:${m[3]}${last}')?$select=values`);
    const out = rowsToObjects([hdr.values[0], ...r.values]);
    out.rows.forEach(o=>o._i += (start-first));
    return out;
  }
  async addRow(url, name, values){ const b = await this.book(url); return this.req('POST', `${b}/tables/${encodeURIComponent(name)}/rows/add`, { values:[values] }); }
  async setRow(url, name, index, values){
    const b = await this.book(url);
    const body = await this.req('GET', `${b}/tables/${encodeURIComponent(name)}/dataBodyRange?$select=address`);
    const m = body.address.match(/^(.*)!([A-Z]+)(\d+):([A-Z]+)(\d+)$/);
    const sheet = m[1].replace(/^'|'$/g,'').replace(/''/g,"'"); const row = +m[3] + index;
    return this.req('PATCH', `${b}/worksheets('${encodeURIComponent(sheet.replace(/'/g,"''"))}')/range(address='${m[2]}${row}:${m[4]}${row}')`, { values:[values] });
  }
  async sheetNames(url){ const b = await this.book(url); const r = await this.req('GET', `${b}/worksheets?$select=name`); return r.value.map(w=>w.name); }
  async sheetText(url, sheet){ const b = await this.book(url); const r = await this.req('GET', `${b}/worksheets('${encodeURIComponent(sheet)}')/usedRange(valuesOnly=true)?$select=text,address`);
    const m = r.address.match(/!([A-Z]+)(\d+)/); const colOff = colNum(m[1])-1, rowOff = +m[2]-1;
    const grid = []; for(let i=0;i<rowOff;i++) grid.push([]);
    r.text.forEach(row=>grid.push([...Array(colOff).fill(''), ...row])); return grid; }
  async sheetValues(url, sheet){ const b = await this.book(url); const r = await this.req('GET', `${b}/worksheets('${encodeURIComponent(sheet)}')/usedRange(valuesOnly=true)?$select=values`); return r.values; }
}
function colNum(s){ let n=0; for (const ch of s) n = n*26 + (ch.charCodeAt(0)-64); return n; }

class ApiData extends Data {

    if (res.status===401 && !retried) return this.call(method, r, body, params, true);

  async addRequest(o){ await this.call('POST','req',{ email:o.Email, type:o['Leave Type'], dates:String(o.Dates).split(/[,\s]+/).filter(Boolean), reason:o.Reason }); await this.requests(true); }
  async updateRequest(id, patch){ if (patch.Status==='Cancelled'){ await this.call('POST','cancel',{id}); await this.requests(true); return; } throw new Error('Not supported'); }
  async addSwap(o){ await this.call('POST','swap',{ teammate:o['Teammate Email'], myDate:o['Requester Date'], theirDate:o['Teammate Date'], myShift:o['Requester Shift'], theirShift:o['Teammate Shift'], reason:o.Reason }); await this.swaps(true); }
  async updateSwap(id, patch){ if (patch.Status==='Cancelled') await this.call('POST','swapcancel',{id}); else await this.call('POST','swapdecide',{ id, ok:patch.Status==='Approved', note:patch.Note }); await this.swaps(true); }
  async updateAccess(row){ await this.call('POST','access',{ row }); await this.access(true); }
  async addAccess(row){ await this.call('POST','access',{ row:{...row,_i:undefined} }); await this.access(true); }
}

let msalApp = null, account = null;
const SCOPES = ['User.Read'];
function loadScript(src){ return new Promise((ok,bad)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=bad; document.head.appendChild(s); }); }
async function initAuth(){
  const srcs = ['https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js','https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js','https://unpkg.com/@azure/msal-browser@2.39.0/lib/msal-browser.min.js'];
  for (const s of srcs){ try { await loadScript(s); if (window.msal) break; } catch(e){} }
  if (!window.msal) throw new Error('Could not load the Microsoft sign-in library.');
  msalApp = new msal.PublicClientApplication({ auth:{ clientId:CONFIG.clientId, authority:`https://login.microsoftonline.com/${CONFIG.tenantId||'organizations'}`, redirectUri: location.origin+location.pathname }, cache:{ cacheLocation:'localStorage' } });
  if (msalApp.initialize) await msalApp.initialize();
  const r = await msalApp.handleRedirectPromise();
  account = r?.account || (msalApp.getActiveAccount && msalApp.getActiveAccount()) || msalApp.getAllAccounts()[0] || null;
  if (!account){ await msalApp.loginRedirect({ scopes: SCOPES }); return null; }
  msalApp.setActiveAccount && msalApp.setActiveAccount(account);
  return account;
}
async function getToken(force){
  try { const r = await msalApp.acquireTokenSilent({ scopes:SCOPES, account, forceRefresh:!!force }); if (!r.idToken) throw new Error('no id token'); return r.idToken; }
  catch(e){ await msalApp.acquireTokenRedirect({ scopes:SCOPES, account }); throw e; }
}

/* agent status bar: Work / Break / Log out */
async function mountStatusBar(){
  const u=S.me; const bm=S.settings.BreakMinutes; await S.D.attendance();
  const el=$('#statusbar'); let armed=null, busy=false;
  const paint = () => {
    const st = shiftState(S.D.cache.att.rows, u.email);
    const mode = !st.open ? 'out' : st.onBreak ? 'break' : 'work';
    const since = st.open ? (Date.now()-st.open.in)/6e4 - st.breakMins : 0;
    const left = bm - st.breakMins;
    const text = mode==='out' ? `<b>Logged out</b><span>Press Work when your shift starts</span>`
      : mode==='work' ? `<b>Working</b><span>since ${hm(st.open.in)} · ${fmtMins(since)} worked · break ${Math.round(st.breakMins)}/${bm} min</span>`
      : `<b>${left>=0?'On break':'Break over'}</b><span>${left>=0?fmtMins(left)+' left':'over by '+fmtMins(-left)} · press Work when you're back</span>`;
    el.className = 'statusbar m-'+mode+(mode==='break'&&left<0?' m-over':'');
    el.innerHTML = `<div class="sb-state"><i class="dot"></i><div>${text}</div></div>
      <div class="seg" role="group" aria-label="Set your status">
        <button data-st="work" class="${mode==='work'?'on':''}" ${busy?'disabled':''} aria-pressed="${mode==='work'}"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/></svg>Work</button>
        <button data-st="break" class="${mode==='break'?'on':''}" ${busy||mode==='out'?'disabled':''} aria-pressed="${mode==='break'}" ${mode==='out'?'title="Press Work first"':''}><svg viewBox="0 0 24 24"><path d="M4 9h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5V9z"/><path d="M17 10h1.5a2.5 2.5 0 010 5H17"/><path d="M8 3v3M12 3v3"/></svg>Break</button>
        <button data-st="out" class="${mode==='out'?'on':''} ${armed==='out'?'armed':''}" ${busy||mode==='out'?'disabled':''} aria-pressed="${mode==='out'}"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1011.4 0"/></svg>${armed==='out'?'Confirm log out':'Log out'}</button>
      </div>`;
    el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>choose(b.dataset.st, mode));
  };
  const choose = async (want, mode) => {
    if (want===mode) return;
    if (want==='out' && armed!=='out'){ armed='out'; paint(); setTimeout(()=>{ if(armed==='out'){ armed=null; paint(); } }, 4000); return; }
    armed=null; busy=true; paint();
    try{
      const cur = shiftState(S.D.cache.att.rows, u.email); const date = cur.open ? cur.open.date : dkey(new Date());
      if (want==='work'){ if (!cur.open) await recordAction('Clock In', u.row, date); else if (cur.onBreak) await recordAction('Break End', u.row, date); toast((cur.open?'Back at work':'Working')+' from '+hm(new Date())); }
      if (want==='break'){ await recordAction('Break Start', u.row, date); toast('Break started at '+hm(new Date())); }
      if (want==='out'){ if (cur.onBreak) await recordAction('Break End', u.row, date, 'auto: logged out on break'); await recordAction('Clock Out', u.row, date); toast('Logged out at '+hm(new Date())); }
    }catch(e){ alertBox(e); }
    busy=false; paint(); S._boardPaint && S._boardPaint();
  };
  paint(); statusTimer = setInterval(paint, 30000);
}

/* ============================ Attendance logic ============================ */
function shiftState(events, email){
  const mine = events.filter(e=>e.Email===email).sort((a,b)=>a.ts-b.ts);
  let open=null;
  for (const e of mine){
    if (e.Action==='Clock In') open = { date:e['Shift Date'], in:e.ts, events:[e] };
    else if (open){ open.events.push(e); if (e.Action==='Clock Out') open=null; }
  }
  if (open && (Date.now()-open.in) > 20*3600e3) open = null; // stale forgotten clock-out
  let onBreak=null, breakMins=0;
  if (open){ for (const e of open.events){ if (e.Action==='Break Start') onBreak=e.ts; if (e.Action==='Break End' && onBreak){ breakMins += (e.ts-onBreak)/6e4; onBreak=null; } } }
  return { open, onBreak, breakMins: breakMins + (onBreak?(Date.now()-onBreak)/6e4:0) };
}
function summarise(events, email, date){
  const ev = events.filter(e=>e.Email===email && e['Shift Date']===date).sort((a,b)=>a.ts-b.ts);
  const o = { ev, in:null, out:null, breakMins:0, breaks:0, openBreak:false };
  let bs=null;
  for (const e of ev){
    if (e.Action==='Clock In' && !o.in) o.in=e.ts;
    if (e.Action==='Clock Out') o.out=e.ts;
    if (e.Action==='Break Start'){ bs=e.ts; o.breaks++; }
    if (e.Action==='Break End' && bs){ o.breakMins += (e.ts-bs)/6e4; bs=null; }
  }
  if (bs){ o.openBreak=true; if (!o.out) o.breakMins += (Date.now()-bs)/6e4; }
  return o;
}

async function leaveStats(person){
  const tr = (await S.D.tracker()).items; const bal = await S.D.balance(); const n = norm(person['Full Name']);
  const mine = tr.filter(x=>x.n===n);
  const consumed = mine.filter(x=>x.approved && (x.type==='Holiday'||x.type==='Emergency')).length;

async function queueOf(p, dates){
  const label = t => String(t||'').split('/').slice(1).map(x=>x.split(',')[0].trim()).filter(x=>x && !/^[\d:\- ]+$/.test(x) && !/^(v|r)$/i.test(x));
  const seen = new Set(); const look = async list => { const t = await Promise.all(list.map(d=>S.D.shiftFor(p,d).catch(()=>({text:''})))); t.forEach(x=>label(x.text).forEach(l=>seen.add(l))); };
  await look(dates.slice(0,7).map(fromKey)); if (!seen.size) await look([0,1,2,3,4,5,6].map(i=>addDays(mondayOf(new Date()),i)));
  return [...seen].concat(p.Team && ![...seen].some(x=>norm(x)===norm(p.Team)) ? [p.Team] : []).join(' · ');
}
async function paintQueue(queue){

async function decide(id, ok, note){
  if (S.D instanceof ApiData){ await S.D.call('POST','decide',{id,ok,note}); await Promise.all([S.D.requests(true), S.D.tracker(true)]); return; }
  const u=S.me; const r=(await S.D.requests(true)).rows.find(x=>x.ID===id); const now=new Date().toISOString();
  if (r.Status==='Pending Manager'){
    if (!ok) return S.D.updateRequest(id,{Status:'Rejected','Stage 1 By':u.email,'Stage 1 At':now,'Stage 1 Note':note});
    const p = await personByEmail(r.Email);
    if (p && p['Portal Role']==='General Manager'){ await S.D.updateRequest(id,{Status:'Approved','Stage 1 By':u.email,'Stage 1 At':now,'Stage 1 Note':note}); return writeToTracker(id); }
    return S.D.updateRequest(id,{Status:'Pending GM','Stage 1 By':u.email,'Stage 1 At':now,'Stage 1 Note':note});
  }
  if (r.Status==='Pending GM'){
    if (!ok) return S.D.updateRequest(id,{Status:'Rejected','Stage 2 By':u.email,'Stage 2 At':now,'Stage 2 Note':note});
    await S.D.updateRequest(id,{Status:'Approved','Stage 2 By':u.email,'Stage 2 At':now,'Stage 2 Note':note});
    return writeToTracker(id);
  }
}
async function writeToTracker(id){
  if (S.D instanceof ApiData){ await S.D.call('POST','retry',{id}); await Promise.all([S.D.requests(true), S.D.tracker(true)]); return; }
  const r=(await S.D.requests(true)).rows.find(x=>x.ID===id); const acc=(await S.D.access()).rows;
  const by=(acc.find(x=>x.Email===r['Submitted By'])||{})['Full Name']||r['Submitted By'];
  try{
    await S.D.appendTracker(r.dateList.map(d=>({date:d,name:r.Name,role:r['Tracker Role'],by,type:r['Leave Type'],comment:'Portal '+r.ID+(r.Reason?' – '+r.Reason:'')})));
    await S.D.updateRequest(id,{'Written To Tracker':'Yes'});
  }catch(e){ throw new Error('Approved, but writing to the Leaves Tracker failed: '+e.message+'. Use "Retry tracker write" in the leave history.'); }
}

  const clients=['GTO Ms. Salma A.','Zeina S. – GOLD','Mahmoud E. (HSBC-Gold)','Omar K. – Platinum','Nour H.'];
  const types=[['CTC','Incorrect Financial Information'],['CTB','File Error'],['CTQ','CRT Breach'],['NCE','Soft-Skills Gap']];
  acc.forEach((a,i)=>{ for(let k=0;k<4;k++){ const d=addDays(today,-(k*6+i%5)); const bad=(i+k)%5===0; const score = bad? 0.72 : (i+k)%3===0 ? 0.87 : 1;

  const disputes=[{ ID:'DDEMO1', 'Raised At':new Date().toISOString(), 'Eval ID':evals.find(e=>e.score<0.8).id, Month:'Oct 2026', 'Agent Email':evals.find(e=>e.score<0.8).agentEmail, 'Agent Name':evals.find(e=>e.score<0.8).agentFull, 'Chat Date':evals.find(e=>e.score<0.8).date, Client:'', Score:0.72, 'Raised By':'tl1@gto.demo', Reason:'The supplier confirmed availability by phone before the quote — call log attached in the thread.', Status:'Open', 'Email Sent':'Yes' }];

  const d = demoQuality(); const team = new Set(S.D.cache.access.rows.filter(r=>r['Manager Email']===u.email).map(r=>r.Email));

function kbDetail(id){
  const kb=S._kb; const it=kb && kb.items.find(i=>i.id===id); if (!it) return;
  const f=it.fields; const pick = rx => Object.entries(f).find(([k])=>rx.test(k));

    .map(([rx,l])=>{ const p=pick(rx); return p?[l,p[1]]:null; }).filter(Boolean);
  const lead = pick(/^benefit|discount rate/i); const restr = pick(/booking restrictions/i); const roll = pick(/rollout/i); const tc = pick(/terms/i);
  const shown = new Set([lead,restr,roll,tc].filter(Boolean).map(x=>x[0]));
  const factKeys = new Set([/offer period/i,/booking period/i,/expiry/i,/min purchase/i,/booking for others/i,/^refundable\s*$|amount is refundable/i,/quotation/i,/buying availability/i].map(rx=>(pick(rx)||[])[0]).filter(Boolean));
  const covKeys = /^(refundable hotels|nr hotels|international flights|domestic flights|attraction|theme parks)/i;
  const others = Object.entries(f).filter(([k])=>!/promotion details/i.test(k) && !shown.has(k) && !factKeys.has(k) && !covKeys.test(k));
  const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u=>`<a href="${u.replace(/[).,]+$/,'')}" target="_blank" rel="noopener">${u}</a>`);
  const m=document.createElement('div'); m.className='modal'; m.innerHTML = `<div class="card wide" role="dialog" aria-modal="true" aria-label="${esc(it.name)}">
    <div class="kb-d-head"><div style="flex:1;min-width:0"><span class="chip cat">${esc(it.cat)}</span>${kbChip(it)}<h2>${esc(it.name)}</h2></div><button class="btn" data-close aria-label="Close">✕</button></div>
    ${lead?`<div class="kb-sec" style="border-top:0;padding-top:16px"><small>${esc(lead[0])}</small><div>${linkify(lead[1])}</div></div>`:''}
    ${facts.length?`<div class="kb-facts">${facts.map(([l,x])=>`<div><small>${esc(l)}</small><span>${linkify(x)}</span></div>`).join('')}</div>`:''}
    <small style="display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:8px">What it can be used for</small>
    <div class="kb-covlist">${it.cover.map(([l,y],k)=>`<div class="${y===true?'y':y===false?'n':''}"><span class="cov"><i class="${y===true?'y':y===false?'n':''}">${KBI.cov[k]}</i></span>${esc(l)}<b>${y===true?'Yes':y===false?'No':'See below'}</b></div>`).join('')}</div>
    ${restr?`<div class="kb-sec"><small>Booking restrictions</small><div>${linkify(restr[1])}</div></div>`:''}
    ${others.map(([k,x])=>`<div class="kb-sec"><small>${esc(k)}</small><div>${linkify(x)}</div></div>`).join('')}
    ${roll?`<div class="kb-sec"><small>Rollout message</small><div>${linkify(roll[1])}</div></div>`:''}
    <div class="row" style="margin-top:16px;gap:8px">${it.link?`<a class="btn" href="${esc(it.link)}" target="_blank" rel="noopener">Open T&amp;Cs ↗</a>`:''}<span class="spacer"></span><button class="btn primary" id="kbaskthis">${KBI.spark.replace('<svg','<svg style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;vertical-align:-3px;margin-right:6px"')}Ask about this offer</button></div>
  </div>`;
  document.body.appendChild(m);

const AI_SUGG = ['What offers are on sale now?','Magic Pass expiry','Can a member book for someone else with the Holiday Pass?','Which offers cover non-refundable hotels?','فلايت كلوب أقل مبلغ كام؟'];
function aiMd(text){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])_([^_]{2,80})_(?=$|[\s.,)])/g,'$1<i style="color:var(--faint);font-size:12.5px">$2</i>').replace(/\[\[([^\]]+)\]\]/g,(m,n0)=>{ const n=n0.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'"); const it=(S._kb?.items||[]).find(i=>norm(i.name)===norm(n))||(S._kb?.items||[]).find(i=>norm(i.name).startsWith(norm(n))||norm(n).startsWith(norm(i.name))); return it?`<button class="ai-ref" data-ref="${esc(it.id)}">${esc(n)}</button>`:`<b>${esc(n)}</b>`; })
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,(m,p,u)=>`${p}<a href="${u.replace(/[.,]+$/,'')}" target="_blank" rel="noopener">${u}</a>`);
  const out=[]; let list=null;
  String(text).split('\n').forEach(line=>{ const l=line.trim(); const b=l.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (b){ if(!list){ list=[]; } list.push(`<li>${inline(b[1])}</li>`); return; }
    if (list){ out.push(`<ul>${list.join('')}</ul>`); list=null; }
    if (!l) return; const h=l.match(/^#{1,4}\s+(.*)$/); out.push(h?`<h4>${inline(h[1])}</h4>`:`<p>${inline(l)}</p>`); });
  if (list) out.push(`<ul>${list.join('')}</ul>`);
  return out.join('');
}

function aiPaint(){
  const b=$('#aibody'); if (!b) return; const kb=S._kb||{};
  b.innerHTML = (S.aiChat.length ? '' : `<div class="ai-msg a"><p>Hi ${esc(String(S.me.name).split(/\s+/)[0])} 👋 Ask me about any GTO promotion, product, voucher or pass: discounts, dates, minimum purchase, expiry, what it covers, booking for others, restrictions and T&amp;Cs. English or Arabic.</p><p style="color:var(--muted);font-size:13px">Tip: name the offer, e.g. “Magic Pass expiry”. Follow-up questions like “is it refundable?” stay on the same offer.</p></div><div class="ai-sugg">${AI_SUGG.map(s=>`<button data-sg="${esc(s)}">${esc(s)}</button>`).join('')}</div>`)
    + S.aiChat.map((m,i)=>m.role==='user'?`<div class="ai-msg u">${esc(m.content)}</div>`:`<div class="ai-msg a ${m.err?'err':''}">${m.err?esc(m.content):aiMd(m.content)}</div>${!m.err&&i===S.aiChat.length-1&&m.follow&&m.follow.length&&!S.aiBusy?`<div class="ai-follow">${m.follow.map((f,k)=>`<button data-fu="${k}">${esc(f.label)}</button>`).join('')}</div>`:''}`).join('')
    + (S.aiBusy?'<div class="ai-msg a"><span class="ai-dots"><i></i><i></i><i></i></span></div>':'');
  b.querySelectorAll('[data-sg]').forEach(x=>x.onclick=()=>{ $('#aiq').value=x.dataset.sg; aiSend(); });
  b.querySelectorAll('[data-fu]').forEach(x=>x.onclick=()=>{ const f=S.aiChat[S.aiChat.length-1].follow[+x.dataset.fu]; $('#aiq').value=f.q; aiSend(f.item); });
  b.querySelectorAll('[data-ref]').forEach(x=>x.onclick=()=>{ if (S.tab!=='kb'){ S.kbOpen=x.dataset.ref; S.tab='kb'; render(); } else kbDetail(x.dataset.ref); });
  b.scrollTop=b.scrollHeight; const s=$('#aisend'); if (s) s.disabled=!!S.aiBusy;
}
async function aiSend(item){
  const q=$('#aiq'); const text=q.value.trim(); if (!text || S.aiBusy) return;
  q.value=''; q.style.height='auto'; S.aiChat.push({ role:'user', content:text }); S.aiBusy=true; aiPaint();
  try {
    if (!S._kb) await kbData();
    if (!(S.D instanceof ApiData)) throw new Error('The assistant only works in the live portal.');
    const r = await S.D.call('POST','ask',{ question:text, ctx:S.aiCtx||null, item:typeof item==='string'?item:null, messages:S.aiChat.filter(m=>!m.err).map(m=>({ role:m.role, content:m.content })) });
    if (r.item) S.aiCtx = r.item;
    S.aiChat.push({ role:'assistant', content:r.answer||'(no answer)', follow:r.follow||[] });
  } catch(e){ S.aiChat.push({ role:'assistant', content:e.message, err:true }); }
  S.aiBusy=false; aiPaint();
}

async function viewHome(){
  const myRender = S.renderId; const v=$('#view'); const u=S.me; const lim=S.settings.EmergencyLimit;
  const [st, queue, sq] = await Promise.all([leaveStats(u.row), approvalQueue(), swapQueue()]);
  const alerts = isMgr(u)? await emergencyAlerts():[];
  const myPending = (await S.D.requests()).rows.filter(r=>r.Email===u.email&&/^Pending/.test(r.Status)).length;
  const mon = mondayOf(new Date()); const days=[0,1,2,3,4,5,6].map(i=>addDays(mon,i));
  const shifts = await Promise.all(days.map(d=>S.D.shiftFor(u.row,d)));
  const tk = dkey(new Date());
  const qaUser = u.role==='Quality' || u.row['Quality Team']==='Yes';
  let qNote = '';
  if (!isMgr(u) || qaUser){ try { const q = await qualityData(); const open = q.disputes.filter(d=>d.Status==='Open');
    if (qaUser && open.length) qNote = `<div class="alert" data-go="quality" style="cursor:pointer"><b>${open.length} quality ${open.length===1?'dispute is':'disputes are'} waiting for review.</b> Open Quality to accept or reject.</div>`;
    else if (!qaUser){ const mine = q.disputes.filter(d=>d['Agent Email']===u.email); const o = mine.filter(d=>d.Status==='Open').length; const done = mine.filter(d=>d.Status!=='Open' && (Date.now()-parseTs(d['Responded At']))<14*864e5);
      if (o) qNote = `<div class="alert" data-go="quality" style="cursor:pointer"><b>Your team leader raised ${o===1?'a dispute':o+' disputes'} about your quality ${o===1?'evaluation':'evaluations'}.</b> The quality team will review it. Open Quality to see the details.</div>`;
      else if (done.length) qNote = `<div class="alert" data-go="quality" style="cursor:pointer"><b>A dispute about your quality evaluation was ${esc(done[done.length-1].Status.toLowerCase())}.</b> Open Quality to see the response.</div>`; }
  } catch(e){} }
  if (S.renderId !== myRender) return;
  v.innerHTML = `
    ${qNote}
    ${alerts.length?`<div class="alert bad" data-go="leave" style="cursor:pointer"><b>${alerts.length} ${alerts.length===1?'person is':'people are'} over ${lim} emergency days:</b> ${alerts.slice(0,4).map(a=>esc(a.name)+' ('+a.count+')').join(', ')}${alerts.length>4?' and more':''}. Open Leaves to review.</div>`:''}
    <div id="board"></div>
    <div class="metrics sec">
      <div class="m go" data-go="leave"><h3>Leave remaining</h3><div class="stat">${st.remaining??'—'}<small> days</small></div><p>${st.pendingDays?`${st.pendingDays} days waiting for approval`:`of ${st.allowance??'—'} this year`}</p></div>
      <div class="m go ${st.emerg>lim?'alert-m':''}" data-go="leave"><h3>Emergency used</h3><div class="stat">${st.emerg}<small> of ${lim}</small></div><p>${st.emerg>lim?'over the limit':`${Math.max(0,lim-st.emerg)} left`}</p></div>
      ${isMgr(u)
        ? `<div class="m go" data-go="${!queue.length&&sq.length?'sched':'leave'}"><h3>Waiting for you</h3><div class="stat" style="${queue.length+sq.length?'color:var(--warn)':''}">${queue.length+sq.length}</div><p>${queue.length||sq.length?[queue.length?queue.length+' leave':'',sq.length?sq.length+' swap':''].filter(Boolean).join(' and ')+' to approve':'nothing to approve'}</p></div>`
        : `<div class="m go" data-go="leave"><h3>My requests</h3><div class="stat">${myPending}</div><p>${myPending?'waiting for approval':'none pending'}</p></div>`}
    </div>
    <div class="row sec" style="margin-bottom:10px"><h2 style="margin:0;font-size:17px;font-weight:600">This week</h2><span class="spacer"></span><button class="btn sm" data-go="sched">Full schedule</button></div>
    <div class="week">${days.map((d,i)=>{ const t=shifts[i].text; const ps=parseShift(t); const off=!ps; return `<div class="${dkey(d)===tk?'today':''} ${off?'off':''}"><span>${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric'})}</span><b title="${esc(t)}">${esc(ps?ps.label:(t||'—'))}</b></div>`; }).join('')}</div>`;
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{ S.tab=el.dataset.go; render(); });
  if (S.renderId === myRender) await mountBoard($('#board'));
  kbData().then(kb=>{ if (S.renderId !== myRender) return; const seen=kbSeen(); const fresh=(kb.updates||[]).filter(u=>String(u['Posted At'])>seen && Date.now()-parseTs(u['Posted At'])<7*864e5);
    if (!fresh.length) return; const d=document.createElement('div'); d.className='alert info'; d.style.cursor='pointer';
    d.innerHTML=`<b>${fresh.length===1?'New update':fresh.length+' new updates'}:</b> ${esc(fresh[0].Title)}${fresh.length>1?' and more':''}. Open the Knowledge tab to read ${fresh.length===1?'it':'them'}.`;
    d.onclick=()=>{ S.tab='kb'; render(); }; $('#view').prepend(d); }).catch(()=>{});
}

/* ============================ Admin (Access list) ============================ */
async function viewAdmin(){
  const v=$('#view'); const t=await S.D.access(true);
  v.innerHTML = `<div class="card"><div class="row"><h2 style="margin:0">People</h2><span class="spacer"></span><input id="adq" class="i" style="width:220px" placeholder="Search"><select id="adr" class="i" style="width:auto"><option value="">All roles</option><option value="none">No role yet</option>${ROLES.map(r=>`<option>${r}</option>`).join('')}</select><button class="btn primary" id="adnew">Add person</button></div>
    <p class="muted">Everyone who can open the portal. This is the same list as the Access tab in "GTO Portal Data.xlsx", so you can edit it in either place.</p><div class="tablewrap" id="adt"></div></div>`;
  const paint=()=>{ const q=norm($('#adq').value), rf=$('#adr').value;
    const list=t.rows.filter(r=>(!q||norm(r['Full Name']+' '+r.Email+' '+r.Team).includes(q)) && (!rf||(rf==='none'?!ROLES.includes(r['Portal Role']):r['Portal Role']===rf)));
    $('#adt').innerHTML = `<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Team leader</th><th>Team</th><th>Active</th><th></th></tr></thead>${list.map(r=>`<tr><td>${esc(r['Full Name'])}</td><td>${esc(r.Email)||'<span class="chip warn">missing</span>'}</td><td>${ROLES.includes(r['Portal Role'])?esc(r['Portal Role']):'<span class="chip warn">none</span>'}</td><td class="muted">${esc(r._tl||(t.rows.find(x=>x.Email===r['Manager Email'])||{})['Full Name']||r['Manager Email'])}</td><td>${esc(r.Team)}</td><td>${/^no$/i.test(String(r.Active||'').trim())?'<span class="chip bad">No</span>':'<span class="chip ok">Yes</span>'}</td><td><button class="btn sm" data-ed="${r._i}">Edit</button></td></tr>`).join('')}</table>`;
    document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editPerson(t.rows.find(x=>x._i===+b.dataset.ed)));
  };
  paint(); $('#adq').oninput=paint; $('#adr').onchange=paint; $('#adnew').onclick=()=>editPerson(null);
}
function editPerson(r){
  const t=S.D.cache.access; const isNew=!r; r = r || {Active:'Yes','Portal Admin':'No'};
  const mgrs=t.rows.filter(x=>x.Email && ['Team Leader','Duty Manager','General Manager','HR'].includes(x['Portal Role']));
  const f=(k,label,inp)=>`<label class="f">${label}</label>${inp||`<input class="i" data-k="${k}" value="${esc(r[k]??'')}">`}`;
  modal(`<h2>${isNew?'Add person':esc(r['Full Name'])}</h2>
    ${f('Email','Work email')}${f('Full Name','Full name (exactly as in the Leaves Tracker)')}
    ${f('Portal Role','Portal role',`<select class="i" data-k="Portal Role"><option value="">—</option>${ROLES.map(x=>`<option ${r['Portal Role']===x?'selected':''}>${x}</option>`).join('')}</select>`)}
    ${f('Team Leader','Team leader',`<select class="i" data-k="Team Leader"><option value="">—</option>${t.rows.filter(x=>['Team Leader','Duty Manager','General Manager','HR'].includes(x['Portal Role'])).map(x=>`<option value="${esc(x['Full Name'])}" ${norm(r._tl||r['Team Leader'])===norm(x['Full Name'])?'selected':''}>${esc(x['Full Name'])} (${esc(x['Portal Role'])})</option>`).join('')}</select>`)}
    ${f('Team','Team')}${f('Tracker Role','Role written in the Leaves Tracker (e.g. Enquiry Agent)')}${f('Rota Name','Name in the rota (only if not found automatically)')}
    <div class="row">${f('Quality Team','Quality team',`<select class="i" data-k="Quality Team"><option ${yes(r['Quality Team'])?'':'selected'}>No</option><option ${yes(r['Quality Team'])?'selected':''}>Yes</option></select>`)}${f('Portal Admin','Portal admin',`<select class="i" data-k="Portal Admin"><option ${yes(r['Portal Admin'])?'':'selected'}>No</option><option ${yes(r['Portal Admin'])?'selected':''}>Yes</option></select>`)}${f('Active','Active',`<select class="i" data-k="Active"><option ${/^no$/i.test(String(r.Active||''))?'':'selected'}>Yes</option><option ${/^no$/i.test(String(r.Active||''))?'selected':''}>No</option></select>`)}</div>
    <div class="row" style="margin-top:16px"><span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="psave">Save</button></div>`);
  $('#psave').onclick=async()=>{
    const o={...r}; delete o._tl; document.querySelectorAll('.modal [data-k]').forEach(i=>o[i.dataset.k]=i.value.trim());
    o.Email=normEmail(o.Email); if(!o['Full Name']) return toast('Name is required');
    const tlRow = t.rows.find(x=>norm(x['Full Name'])===norm(o['Team Leader'])); o['Manager Email'] = tlRow ? tlRow.Email : '';
    $('#psave').disabled=true;
    try{ if(isNew) await S.D.addAccess(o); else await S.D.updateAccess(o); closeModal(); toast('Saved'); viewAdmin(); }catch(e){ alertBox(e); $('#psave').disabled=false; }
  };
}

/* ============================ modal / errors ============================ */
function modal(html){ closeModal(); const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="card">${html}</div>`; m.onclick=e=>{ if(e.target===m||e.target.hasAttribute('data-close')) closeModal(); }; document.body.appendChild(m); }
function closeModal(){ document.querySelectorAll('.modal').forEach(m=>m.remove()); }
function alertBox(e){ console.error(e); modal(`<h2>Couldn't save</h2><div class="alert bad">${esc(e.message||e)}</div><div class="row"><span class="spacer"></span><button class="btn" data-close>OK</button></div>`); }

boot();
</script>
